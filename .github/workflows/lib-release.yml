name: Build and Release the Sidekick RC library

on:
  push:
    tags:
      - "lib-v*"
  workflow_dispatch: {}

permissions:
  contents: write   # REQUIRED for tag-triggered releases

jobs:
  build-android-library:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # Checkout repository
      # ------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------
      # Extract version from tag (falls back to a placeholder for manual runs)
      # Tag format: lib-v1.2.3
      # ------------------------------
      - name: Extract version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#lib-v}"
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ------------------------------
      # Install JDK 17 (FTC-compatible)
      # ------------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------
      # Install Android SDK + build-tools
      # ubuntu-latest runners ship with an Android SDK preinstalled, so we use
      # its sdkmanager directly instead of android-actions/setup-android@v3,
      # which currently fails trying to install the removed "tools" package.
      # ------------------------------
      - name: Install Android platform + build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-30" \
                     "build-tools;30.0.3"

      # ------------------------------
      # Make Gradle wrapper executable
      # ------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------
      # Build Android library (AAR)
      # ------------------------------
      - name: Build library
        run: ./gradlew clean assembleRelease

      # ------------------------------
      # Prepare release body (annotated tag message + static instructions)
      # ------------------------------
      - name: Prepare release body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          # If the tag has an annotation, prepend it as "What's Changed"
          if [ -n "$TAG_MSG" ]; then
            {
              echo "### What's Changed"
              echo ""
              echo "$TAG_MSG"
              echo ""
              echo "---"
              echo ""
            } > release_notes.md
          else
            : > release_notes.md
          fi

          # Append the static JitPack & Gradle instructions
          cat << EOF >> release_notes.md
          Find your TeamCode **build.gradle** file. Beware that there may be multiple **build.gradle** files in your project--you want the one with a line that says \`project(':FtcRobotController')\`. Add the following line to the **dependencies** section:

          \`\`\`
          implementation 'com.github.Loonybot:SidekickRC:lib-v${VERSION}'
          \`\`\`

          In that same file, if you already have a **repositories** section but it doesn't include JitPack, add the following line inside that section:

          \`\`\`
          maven { url 'https://jitpack.io' }
          \`\`\`

          If you don't have a **repositories** section at all, you'll need to add it. Make sure it's on its own and not nested inside another section:

          \`\`\`
          repositories {
              maven { url 'https://jitpack.io' }
          }
          \`\`\`

          Don't forget to sync your project with the updated Gradle file by pressing the Elephant icon in the top-right corner.

          You can usually ignore the assets below.
          EOF

      # ------------------------------
      # Upload AAR to GitHub Release (tag pushes only)
      # ------------------------------
      - name: Upload AAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Sidekick RC library v${{ env.VERSION }}"
          body_path: release_notes.md
          files: |
            **/build/outputs/aar/*release.aar

      # ------------------------------
      # Trigger JitPack prebuild (tag pushes only)
      # ------------------------------
      - name: Trigger JitPack build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Triggering JitPack build for ${TAG}"
          curl -s "https://jitpack.io/com/github/Loonybot/SidekickRC/${TAG}/build.log" || true
