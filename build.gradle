plugins {
    id 'com.android.library' version '8.13.2'
    id 'maven-publish'
}

def libVersion = System.getenv("VERSION") ?: "0.0.1"

android {
    namespace = "com.loonybot.sidekick"
    compileSdk = 30

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk = 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 28

        buildConfigField "String", "LIBRARY_VERSION", "\"${libVersion}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

dependencies {
    // Sidekick returns wrapped FTC objects so these technically should be declared as "api":
    api "org.firstinspires.ftc:RobotCore:12.0.0"
    api "org.firstinspires.ftc:Hardware:12.0.0"
    api "org.firstinspires.ftc:FtcCommon:12.0.0"
    api "org.firstinspires.ftc:Inspection:12.0.0"
    api "org.firstinspires.ftc:Blocks:12.0.0"

    implementation "androidx.annotation:annotation:1.1.0"
    implementation "net.bytebuddy:byte-buddy-android:1.18.14"
    implementation "org.objenesis:objenesis:3.2"
    implementation("org.nanohttpd:nanohttpd-websocket:2.3.1") {
        exclude module: "nanohttpd"
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.github.Loonybot"
                artifactId = "SidekickRC"
                version = libVersion
            }
        }
    }
}
